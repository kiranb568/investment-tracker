<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srishti Wealth Access Setup</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="srishti-wealth-logo.png" type="image/png">
    <script src="ui-preferences.js"></script>
    <link rel="stylesheet" href="quantum-future.css">
    <link rel="stylesheet" href="srishti-light.css">
    <style>
        :root {
            --page-bg: linear-gradient(180deg, #020611 0%, #071224 100%);
            --page-text: #f4f8ff;
            --page-muted: rgba(214, 228, 255, 0.76);
            --panel-bg: rgba(8, 18, 36, 0.82);
            --panel-border: rgba(120, 235, 255, 0.22);
        }
        :root[data-theme="light"] {
            --page-bg: linear-gradient(180deg, #f8fcff 0%, #ebf2ff 100%);
            --page-text: #112240;
            --page-muted: rgba(17, 34, 64, 0.72);
            --panel-bg: rgba(255, 255, 255, 0.92);
            --panel-border: rgba(48, 120, 218, 0.18);
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", sans-serif;
            background: var(--page-bg);
            color: var(--page-text);
        }
        .note {
            max-width: 560px;
            margin: 24px;
            padding: 32px;
            text-align: center;
            border-radius: 24px;
            border: 1px solid var(--panel-border);
            background: var(--panel-bg);
            box-shadow: 0 0 36px rgba(97, 232, 255, 0.08);
        }
        img {
            width: 96px;
            height: 96px;
            object-fit: contain;
            margin-bottom: 14px;
            filter: drop-shadow(0 0 28px rgba(255, 190, 80, 0.22));
        }
        p {
            color: var(--page-muted);
            line-height: 1.7;
        }
    </style>
    <script>
        window.location.replace("signin.html");
    </script>
</head>
<body>
    <div class="note">
        <h1>Access setup happens from the sign-in page.</h1>
        <p>Srishti Wealth no longer exposes a dedicated reset utility in the app.</p>
    </div>
</body>
</html>
