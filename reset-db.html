<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SvarnaFiNexa Access Setup</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="svarnafinexa-logo.png" type="image/png">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #040914 0%, #091323 100%);
            color: #f4f8ff;
        }
        .note {
            max-width: 560px;
            margin: 24px;
            padding: 32px;
            text-align: center;
            border-radius: 24px;
            border: 1px solid rgba(123, 206, 255, 0.18);
            background: rgba(10, 18, 36, 0.82);
            box-shadow: 0 0 36px rgba(97, 232, 255, 0.08);
        }
        img {
            width: 96px;
            height: 96px;
            object-fit: contain;
            margin-bottom: 14px;
            filter: drop-shadow(0 0 28px rgba(255, 190, 80, 0.22));
        }
        p {
            color: rgba(225, 235, 255, 0.76);
            line-height: 1.7;
        }
    </style>
    <script>
        setTimeout(() => {
            window.location.href = "signin.html";
        }, 1500);
    </script>
</head>
<body>
    <div class="note">
        <img src="svarnafinexa-logo.png" alt="SvarnaFiNexa logo">
        <h1>Access setup happens from the sign-in page.</h1>
        <p>SvarnaFiNexa no longer exposes a dedicated reset utility in the app. Redirecting you to sign in.</p>
    </div>
</body>
</html>
