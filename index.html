<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Tracker - Login/Register</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-container {
            max-width: 450px;
            width: 100%;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header h1 {
            color: #0f3460;
            font-size: 2.2em;
            margin-bottom: 10px;
        }
        .auth-header p {
            color: #666;
            font-size: 0.95em;
        }
        .form {
            display: none;
        }
        .form.active {
            display: block;
        }
        .form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #b2ebf2;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        .form input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.3);
        }
        .form button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        .form button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .toggle-link {
            text-align: center;
            color: #666;
        }
        .toggle-link a {
            color: #00d4ff;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }
        .toggle-link a:hover {
            color: #0097a7;
            text-decoration: underline;
        }
        #message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }
        #message.success {
            color: #27ae60;
            background-color: #d5f4e6;
            border-left: 4px solid #27ae60;
        }
        #message.error {
            color: #e74c3c;
            background-color: #fadbd8;
            border-left: 4px solid #e74c3c;
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <h1>💰 Investment Tracker</h1>
                <p>Track & Manage Your Investments</p>
            </div>

            <div id="message"></div>

            <!-- Login Form -->
            <div id="login-form" class="form active">
                <h2 style="text-align: center; color: #0f3460; margin-bottom: 25px;">Login</h2>
                <input type="email" id="login-email" placeholder="Email" required />
                <input type="password" id="login-pass" placeholder="Password" required />
                <button onclick="handleLogin()">Login</button>
                <p class="toggle-link">Don't have an account? <a onclick="toggleForms()">Register here</a></p>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="form">
                <h2 style="text-align: center; color: #0f3460; margin-bottom: 25px;">Register</h2>
                <input type="text" id="reg-name" placeholder="Full Name" required />
                <input type="email" id="reg-email" placeholder="Email" required />
                <input type="password" id="reg-pass" placeholder="Password (min 6 chars)" required />
                <input type="password" id="reg-pass-confirm" placeholder="Confirm Password" required />
                <button onclick="handleRegister()">Register</button>
                <p class="toggle-link">Already have an account? <a onclick="toggleForms()">Login here</a></p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const hasFirebasePlaceholders = Object.values(firebaseConfig).some(value => value.includes('YOUR_'));

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        window.firestoreDb = firebase.firestore();
        window.hasFirebasePlaceholders = hasFirebasePlaceholders;
    </script>
    <script src="auth.js"></script>
    <script>
        function toggleForms() {
            document.getElementById('login-form').classList.toggle('active');
            document.getElementById('register-form').classList.toggle('active');
            document.getElementById('message').style.display = 'none';
            clearForms();
        }

        function clearForms() {
            document.getElementById('login-email').value = '';
            document.getElementById('login-pass').value = '';
            document.getElementById('reg-name').value = '';
            document.getElementById('reg-email').value = '';
            document.getElementById('reg-pass').value = '';
            document.getElementById('reg-pass-confirm').value = '';
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-pass').value;

            if (!email || !password) {
                showMessage('Please enter email and password', 'error');
                return;
            }

            if (!email.includes('@')) {
                showMessage('Please enter a valid email', 'error');
                return;
            }

            if (await loginUser(email, password)) {
                showMessage('Login successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 1500);
            }
        }

        async function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-pass').value;
            const confirmPassword = document.getElementById('reg-pass-confirm').value;

            if (!name || !email || !password || !confirmPassword) {
                showMessage('Please fill all fields', 'error');
                return;
            }

            if (!email.includes('@')) {
                showMessage('Please enter a valid email', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }

            if (await registerUser(name, email, password)) {
                showMessage('Registration successful! Please login.', 'success');
                setTimeout(() => {
                    clearForms();
                    toggleForms();
                }, 1500);
            }
        }

        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = msg;
            msgDiv.className = type;
            msgDiv.style.display = 'block';
        }

        // Allow Enter key
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('login-pass').addEventListener('keypress', e => {
                if (e.key === 'Enter') handleLogin();
            });
            document.getElementById('reg-pass-confirm').addEventListener('keypress', e => {
                if (e.key === 'Enter') handleRegister();
            });
            initializeDatabase();
        });
    </script>
</body>
</html>
