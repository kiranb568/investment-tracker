<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Srishti Wealth</title>
    <meta name="theme-color" content="#0b338b">
    <link rel="icon" href="srishti-wealth-logo.png" type="image/png">
    <script src="ui-preferences.js"></script>
    <link rel="stylesheet" href="quantum-future.css">
    <link rel="stylesheet" href="srishti-light.css">
    <style>
        :root {
            --off-bg:
                radial-gradient(circle at top, rgba(88, 238, 255, 0.2), transparent 30%),
                linear-gradient(180deg, #020611 0%, #071224 100%);
            --off-text: #f4f8ff;
            --off-muted: rgba(214, 228, 255, 0.78);
            --off-card: rgba(8, 18, 36, 0.84);
            --off-border: rgba(120, 235, 255, 0.24);
        }
        :root[data-theme="light"] {
            --off-bg:
                radial-gradient(circle at top, rgba(31, 165, 255, 0.18), transparent 30%),
                linear-gradient(180deg, #f8fcff 0%, #ebf2ff 100%);
            --off-text: #112240;
            --off-muted: rgba(17, 34, 64, 0.74);
            --off-card: rgba(255, 255, 255, 0.92);
            --off-border: rgba(48, 120, 218, 0.2);
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
            font-family: "Space Grotesk", "Segoe UI", sans-serif;
            background: var(--off-bg);
            color: var(--off-text);
        }
        .card {
            width: min(560px, 100%);
            padding: 32px;
            border-radius: 28px;
            border: 1px solid var(--off-border);
            background: var(--off-card);
            box-shadow: 0 0 40px rgba(97, 232, 255, 0.08);
            text-align: center;
        }
        img {
            width: 96px;
            height: 96px;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(255, 190, 80, 0.22));
        }
        h1 {
            margin: 18px 0 12px;
            font-size: clamp(2rem, 5vw, 3rem);
        }
        p {
            color: var(--off-muted);
            line-height: 1.8;
        }
        button {
            margin-top: 14px;
            min-height: 48px;
            padding: 0 18px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            color: #04111f;
            background: linear-gradient(135deg, #61e8ff, #7d9cff, #9762ff);
        }
    </style>
    <link rel="stylesheet" href="srishti-light.css">
</head>
<body>
    <div class="card">
        <h1>You’re offline.</h1>
        <p>Srishti Wealth is still available for core app-shell access, but this page needs a network connection. Reconnect and try again.</p>
        <button type="button" onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
