<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srishti Wealth Auth</title>
    <meta name="theme-color" content="#f7f9ff">
    <link rel="icon" href="srishti-wealth-logo.png" type="image/png">
    <script src="ui-preferences.js"></script>
    <link rel="stylesheet" href="quantum-future.css">
    <link rel="stylesheet" href="srishti-light.css">
    <style>
        :root {
            --page-bg:
                radial-gradient(circle at top, rgba(88, 238, 255, 0.2), transparent 30%),
                linear-gradient(180deg, #020611 0%, #071224 100%);
            --page-text: #f4f8ff;
            --page-muted: rgba(214, 228, 255, 0.76);
            --panel-bg: rgba(8, 18, 36, 0.84);
            --panel-border: rgba(120, 235, 255, 0.22);
            --input-bg: rgba(255, 255, 255, 0.04);
        }
        :root[data-theme="light"] {
            --page-bg:
                radial-gradient(circle at top, rgba(31, 165, 255, 0.18), transparent 30%),
                linear-gradient(180deg, #f8fcff 0%, #ebf2ff 100%);
            --page-text: #112240;
            --page-muted: rgba(17, 34, 64, 0.72);
            --panel-bg: rgba(255, 255, 255, 0.92);
            --panel-border: rgba(48, 120, 218, 0.18);
            --input-bg: rgba(13, 30, 58, 0.04);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: "Space Grotesk", "Segoe UI", sans-serif;
            background: var(--page-bg);
            color: var(--page-text);
        }
        .card {
            width: min(460px, 100%);
            border-radius: 24px;
            border: 1px solid var(--panel-border);
            background: var(--panel-bg);
            box-shadow: 0 0 40px rgba(88, 238, 255, 0.1);
            padding: 28px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .brand img {
            width: 68px;
            height: 68px;
            object-fit: contain;
            filter: drop-shadow(0 0 26px rgba(255, 190, 80, 0.22));
        }
        .brand strong { display: block; }
        .brand small {
            color: var(--page-muted);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-size: 0.72rem;
        }
        h1 { margin: 0 0 6px; font-size: 1.7rem; }
        p { margin: 0 0 18px; color: var(--page-muted); line-height: 1.7; }
        input {
            width: 100%;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            background: var(--input-bg);
            color: var(--page-text);
            padding: 12px 14px;
            font: inherit;
        }
        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            min-height: 46px;
            font-weight: 700;
            color: #04111f;
            cursor: pointer;
            background: linear-gradient(135deg, #58eeff, #7d9cff, #8e63ff);
            box-shadow: 0 16px 36px rgba(88, 238, 255, 0.2);
        }
    </style>
</head>
<body>
    <section class="card">
        <div class="brand">
            <div><small>Platform Auth</small><strong>Srishti Wealth</strong></div>
        </div>
        <h1>Login/Register</h1>
        <p>Legacy auth route maintained for compatibility.</p>
        <form id="auth-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login/Register</button>
        </form>
    </section>
    <script src="script.js"></script>
</body>
</html>
